[package]
name = "luxepix"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "luxepix"
path = "src/main.rs"

[[bin]]
name = "LuxePixUpdater"
path = "src/bin/luxepix_updater.rs"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
arboard = "3.6.1"
rayon = "1.10"
rfd = "0.14"
natord = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
ureq = { version = "2.12.1", default-features = false, features = ["json", "tls"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
regex = "1.13.1"
walkdir = "2.5.0"
strsim = "0.11.1"

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
winresource = "0.1"
